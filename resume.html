<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>关于我 - 我的个人空间</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/resume.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar" data-layout="nav"></nav>

    <!-- 页面标题区域 -->
    <section class="page-header">
        <div class="page-header-bg">
            <div class="page-header-shape"></div>
            <div class="page-header-shape"></div>
            <div class="page-header-shape"></div>
        </div>
        <div class="page-header-content">
            <h1>关于我</h1>
            <p>教育学硕士 · 课程经理 · 市场支持 / 智慧课程设计 / 智能体开发</p>
        </div>
    </section>

    <!-- 简历主体（内容由 data/resume.json 渲染） -->
    <main class="resume-main">
        <div class="container">

            <div id="resumeContent">

                <!-- 名片 -->
                <div class="rcard">
                    <div class="rhead">
                        <img id="rAvatar" class="ravatar" src="images/profile/avatar.jpg" alt="个人头像"
                             onerror="this.src='https://placehold.co/300x300/e8d5ff/9333ea?text=%E7%AE%80%E5%8E%86'">
                        <div class="rhead-main">
                            <div class="rname" id="rName">—</div>
                            <div class="rintent" id="rIntent">—</div>
                            <div class="rmeta">
                                <span><i class="fas fa-phone"></i><a id="rTelLink" href="#">—</a></span>
                                <span><i class="fas fa-envelope"></i><a id="rMailLink" href="#">—</a></span>
                                <span><i class="fas fa-location-dot"></i><b id="rLocation">—</b></span>
                            </div>
                            <div class="rstatus" id="rStatus">—</div>
                        </div>
                    </div>
                </div>

                <!-- 数据看板 -->
                <div class="rkpis" id="rKpis"></div>

                <!-- 个人概述 -->
                <section class="rsec">
                    <h2 class="rsec-title"><i class="fas fa-user-pen"></i>个人概述<em>PROFILE</em></h2>
                    <div class="rsummary" id="rSummary"></div>
                </section>

                <!-- 核心能力 -->
                <section class="rsec">
                    <h2 class="rsec-title"><i class="fas fa-bolt"></i>核心能力<em>CAPABILITIES</em></h2>
                    <div class="rcaps" id="rCaps"></div>
                </section>

                <!-- 工作经历 -->
                <section class="rsec">
                    <h2 class="rsec-title"><i class="fas fa-briefcase"></i>工作经历<em>EXPERIENCE</em></h2>
                    <div id="rExp"></div>
                </section>

                <!-- 教育背景 -->
                <section class="rsec">
                    <h2 class="rsec-title"><i class="fas fa-graduation-cap"></i>教育背景<em>EDUCATION</em></h2>
                    <div id="rEdu"></div>
                </section>

                <!-- 科研成果 -->
                <section class="rsec">
                    <h2 class="rsec-title"><i class="fas fa-flask"></i>科研成果<em>RESEARCH</em></h2>
                    <div class="rpapers" id="rResearch"></div>
                </section>

                <!-- 学生工作 -->
                <section class="rsec">
                    <h2 class="rsec-title"><i class="fas fa-users"></i>学生工作<em>CAMPUS</em></h2>
                    <div class="rblocks" id="rCampus"></div>
                </section>

                <!-- 专业技能 -->
                <section class="rsec">
                    <h2 class="rsec-title"><i class="fas fa-layer-group"></i>专业技能<em>SKILLS</em></h2>
                    <div class="rskills" id="rSkills"></div>
                </section>

            </div>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="footer" data-layout="footer"></footer>

    <!-- 返回顶部按钮 -->
    <button class="back-to-top" id="backToTop">
        <i class="fas fa-arrow-up"></i>
    </button>

        <script src="js/supabase-config.js"></script>
    <script src="js/data-service.js"></script>
<script src="js/resume.js"></script>
<script src="js/layout.js"></script>
<script src="js/main.js"></script>
</body>
</html>
