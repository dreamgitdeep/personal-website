<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日志 - 我的个人空间</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/blog.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar" data-layout="nav"></nav>

    <!-- ==================== 目录视图 ==================== -->
    <div id="listView">

        <!-- 标题区（简洁，无大横幅） -->
        <section class="journal-head">
            <div class="container">
                <h1>我的日志</h1>
                <p class="journal-sub" id="journalSub">正在加载…</p>
            </div>
        </section>

        <!-- 筛选 / 搜索 -->
        <section class="blog-filter">
            <div class="container">
                <div class="filter-bar">
                    <div class="filter-tags">
                        <button class="filter-btn active" data-filter="all">全部</button>
                        <button class="filter-btn" data-filter="study">学习</button>
                        <button class="filter-btn" data-filter="life">生活</button>
                        <button class="filter-btn" data-filter="work">工作</button>
                    </div>
                    <div class="search-box">
                        <input type="text" placeholder="搜索标题、摘要或标签…" id="searchInput">
                        <i class="fas fa-search"></i>
                    </div>
                </div>
            </div>
        </section>

        <!-- 目录表格 -->
        <section class="journal-section">
            <div class="container">
                <div class="journal-table-wrap">
                    <table class="journal-table">
                        <thead>
                            <tr>
                                <th class="col-idx">#</th>
                                <th class="col-date">日期</th>
                                <th class="col-title">标题</th>
                                <th class="col-cat">分类</th>
                                <th class="col-tags">标签</th>
                                <th class="col-time">阅读</th>
                            </tr>
                        </thead>
                        <tbody id="journalBody">
                            <tr class="journal-loading">
                                <td colspan="6">
                                    <i class="fas fa-circle-notch fa-spin"></i> 正在加载日志…
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="journal-empty" id="journalEmpty" hidden>
                    <i class="fas fa-book-open"></i>
                    <p>没有找到匹配的日志</p>
                    <span>换个分类或关键词试试</span>
                </div>
            </div>
        </section>
    </div>

    <!-- ==================== 阅读视图 ==================== -->
    <div id="readerView" hidden>
        <div class="reader-bar">
            <div class="container">
                <button class="reader-back" id="readerBack" type="button">
                    <i class="fas fa-arrow-left"></i> 返回目录
                </button>
            </div>
        </div>

        <div class="container">
            <article class="reader">
                <span class="j-cat" id="readerCat"></span>
                <h1 class="reader-title" id="readerTitle"></h1>
                <div class="reader-meta" id="readerMeta"></div>
                <div class="reader-body" id="readerBody"></div>
                <div class="reader-tags" id="readerTags"></div>
            </article>

            <!-- 上一篇 / 下一篇（放在卡片外） -->
            <nav class="reader-nav" id="readerNav"></nav>
        </div>
    </div>

    <!-- 页脚 -->
    <footer class="footer" data-layout="footer"></footer>

    <!-- 返回顶部按钮 -->
    <button class="back-to-top" id="backToTop">
        <i class="fas fa-arrow-up"></i>
    </button>

    <script src="js/supabase-config.js"></script>
    <script src="js/data-service.js"></script>
    <script src="js/blog.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
