<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人空间 - 欢迎来到我的世界</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar" data-layout="nav"></nav>

    <!-- Hero 区域 -->
    <section class="hero">
        <div class="hero-background">
            <div class="floating-shape shape-1"></div>
            <div class="floating-shape shape-2"></div>
            <div class="floating-shape shape-3"></div>
        </div>
        <div class="hero-content">
            <div class="hero-avatar">
                <img src="images/profile/avatar.jpg" alt="个人头像" onerror="this.src='https://placehold.co/300x300/e0c3fc/8b5cf6?text=秋千'">
            </div>
            <h1 class="hero-title">你好，我是 <span class="highlight">秋千</span></h1>
            <p class="hero-subtitle">永远在学习 <span class="emoji">📚</span></p>
            <p class="hero-description">热爱生活，喜欢探索新事物。在这里记录我的成长、分享我的故事。</p>
        </div>
    </section>

    <!-- 页脚 -->
    <footer class="footer" data-layout="footer"></footer>

    <!-- 返回顶部按钮 -->
    <button class="back-to-top" id="backToTop">
        <i class="fas fa-arrow-up"></i>
    </button>

        <script src="js/supabase-config.js"></script>
    <script src="js/data-service.js"></script>
<script src="js/layout.js"></script>
<script src="js/main.js"></script>
</body>
</html>
